name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check.mjs
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: node --test test/*.test.mjs
